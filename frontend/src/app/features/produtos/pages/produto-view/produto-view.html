<section class="min-h-screen w-full">
  <div class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <h2 class="text-2xl font-bold text-gray-900">
        Visualizar produto
      </h2>

      <p class="mt-1 text-sm text-gray-500">
        Consulte os dados cadastrados do produto.
      </p>
    </div>

    <a
      routerLink="/produtos"
      class="rounded-lg border border-gray-200 bg-white px-5 py-2.5 text-center text-sm font-medium text-gray-900 hover:bg-gray-100 hover:text-blue-700 focus:z-10 focus:outline-none focus:ring-4 focus:ring-gray-100"
    >
      Voltar
    </a>
  </div>

  @if (carregando$ | async) {
    <div class="rounded-lg border border-gray-200 bg-white p-10 shadow-sm">
      <div class="flex items-center justify-center">
        <div
          class="h-8 w-8 animate-spin rounded-full border-4 border-gray-200 border-t-blue-600"
        ></div>
      </div>
    </div>
  } @else if (produto$ | async; as produto) {
    <div class="rounded-lg border border-gray-200 bg-white shadow-sm w-full">
      <div class="border-b border-gray-200 px-6 py-4">
        <h3 class="text-lg font-semibold text-gray-900">
          {{ produto.descricao }}
        </h3>
      </div>

      <dl class="grid gap-6 p-6 sm:grid-cols-2">
        <div>
          <dt class="text-sm font-medium text-gray-500">
            Código
          </dt>
          <dd class="mt-1 text-sm text-gray-900">
            {{ produto.id }}
          </dd>
        </div>

        <div>
          <dt class="text-sm font-medium text-gray-500">
            Saldo
          </dt>
          <dd class="mt-1">
            <span
              class="rounded-full bg-green-100 px-2.5 py-0.5 text-xs font-medium text-green-800"
            >
              {{ produto.saldo }} unidades
            </span>
          </dd>
        </div>
      </dl>

      <div class="border-t border-gray-200 px-6 py-4">
        <a
          [routerLink]="['/produtos', produto.id, 'update']"
          class="inline-flex items-center rounded-lg bg-blue-700 px-5 py-2.5 text-sm font-medium text-white hover:bg-blue-800 focus:outline-none focus:ring-4 focus:ring-blue-300"
        >
          Editar produto
        </a>
      </div>
    </div>
  }
</section>
