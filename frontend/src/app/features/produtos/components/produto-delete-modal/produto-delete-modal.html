<div
  tabindex="-1"
  class="fixed left-0 right-0 top-0 z-50 flex h-[calc(100%-1rem)] max-h-full w-full items-center justify-center overflow-y-auto overflow-x-hidden bg-gray-900/50 p-4 md:inset-0"
  role="dialog"
  aria-modal="true"
  aria-labelledby="modal-exclusao-produto-titulo"
>
  <div class="relative max-h-full w-full max-w-md">
    <div class="relative rounded-lg bg-white shadow">
      <button
        type="button"
        (click)="cancel.emit()"
        class="absolute end-2.5 top-3 ms-auto inline-flex h-8 w-8 items-center justify-center rounded-lg bg-transparent text-sm text-gray-400 hover:bg-gray-200 hover:text-gray-900"
        aria-label="Fechar modal"
      >
        <svg class="h-3 w-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 12 12M13 1 1 13"/>
        </svg>
      </button>

      <div class="p-4 text-center md:p-5">
        <svg class="mx-auto mb-4 h-12 w-12 text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 11V6m0 8h.01M19 10a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/>
        </svg>

        <h3
          id="modal-exclusao-produto-titulo"
          class="mb-5 text-lg font-normal text-gray-500"
        >
          Deseja excluir o produto "{{ produto.descricao }}"?
        </h3>

        <button
          type="button"
          (click)="confirm.emit(produto)"
          [disabled]="carregando"
          class="inline-flex items-center rounded-lg bg-red-600 px-5 py-2.5 text-center text-sm font-medium text-white hover:bg-red-800 focus:outline-none focus:ring-4 focus:ring-red-300 disabled:cursor-not-allowed disabled:opacity-60"
        >
          Sim, excluir
        </button>
        <button
          type="button"
          (click)="cancel.emit()"
          [disabled]="carregando"
          class="ms-3 rounded-lg border border-gray-200 bg-white px-5 py-2.5 text-sm font-medium text-gray-900 hover:bg-gray-100 hover:text-blue-700 focus:z-10 focus:outline-none focus:ring-4 focus:ring-gray-100 disabled:cursor-not-allowed disabled:opacity-60"
        >
          Cancelar
        </button>
      </div>
    </div>
  </div>
</div>
