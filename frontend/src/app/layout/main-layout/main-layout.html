<div class="min-h-screen bg-gray-50">
  <app-toast-container />

  <aside
    class="fixed left-0 top-0 z-40 h-screen w-64 border-r border-gray-200 bg-white"
    aria-label="Sidebar"
  >
    <div class="flex h-full flex-col overflow-y-auto px-3 py-4">
      <a
        routerLink="/produtos"
        class="mb-6 flex items-center rounded-lg px-2 py-2"
      >
        <span class="text-xl font-semibold text-gray-900">
          KORP ERP
        </span>
      </a>

      <ul class="space-y-2 font-medium">
        <li>
          <a
            routerLink="/produtos"
            routerLinkActive="bg-blue-50 text-blue-700"
            [routerLinkActiveOptions]="{ exact: false }"
            class="flex items-center rounded-lg p-2 text-gray-900 hover:bg-gray-100"
          >
            <svg class="h-5 w-5 shrink-0 text-gray-500 transition duration-75" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8Z"/>
              <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m3.3 7 8.7 5 8.7-5M12 22V12"/>
            </svg>
            <span class="ms-3">
              Produtos
            </span>
          </a>
        </li>

        <li>
          <a
            routerLink="/notas-fiscais"
            routerLinkActive="bg-blue-50 text-blue-700"
            [routerLinkActiveOptions]="{ exact: false }"
            class="flex items-center rounded-lg p-2 text-gray-900 hover:bg-gray-100"
          >
            <svg class="h-5 w-5 shrink-0 text-gray-500 transition duration-75" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 3h10a2 2 0 0 1 2 2v16l-4-2-3 2-3-2-4 2V5a2 2 0 0 1 2-2Z"/>
              <path stroke="currentColor" stroke-linecap="round" stroke-width="2" d="M9 8h6M9 12h6M9 16h3"/>
            </svg>
            <span class="ms-3">
              Notas Fiscais
            </span>
          </a>
        </li>
      </ul>
    </div>
  </aside>

  <main class="min-h-screen p-6 sm:ml-64">
    <div class="mx-auto max-w-7xl">
      <router-outlet />
    </div>
  </main>
</div>
